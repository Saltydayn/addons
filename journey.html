<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road to 60 &amp; Beyond!</title>
<meta name="description" content="My leveling journey in WoW Forever: time to 60, pace, deaths, zones, dungeons and more.">
<meta name="theme-color" content="#161513">
<meta property="og:type" content="website">
<meta property="og:title" content="Road to 60 &amp; Beyond!">
<meta property="og:description" content="My leveling journey in WoW Forever: time to 60, pace, deaths, zones, dungeons and more.">
<meta property="og:url" content="https://saltydayn.github.io/addons/journey.html">
<meta property="og:image" content="https://saltydayn.github.io/addons/assets/og-journey.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sunk: #12110f;
    --bg: #161513;
    --card: #1c1a18;
    --raised: #262421;
    --line: rgba(239, 233, 222, 0.08);
    --line-2: rgba(239, 233, 222, 0.16);
    --text: #efe9de;
    --text-2: #aaa398;
    --text-3: #8a847a;
    --accent: #e3a73f;
    --accent-hover: #ecb556;
    --on-accent: #1b1509;
    --cond: #9fb4c7;
    --good: #4cc38a;
    --bad: #e5484d;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --display: "Montserrat", system-ui, sans-serif;
    --sans: "Montserrat", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/24px var(--sans); }
  a { color: inherit; }
  [hidden] { display: none !important; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .shell { max-width: 1200px; margin: 0 auto; padding: 0 32px 64px; }

  /* page switch (shared with the addon page) */
  .pages { display: flex; gap: 24px; padding-top: 32px; font: 400 13px/20px var(--mono); }
  .pages a { color: var(--text-3); text-decoration: none; padding-bottom: 4px; border-bottom: 2px solid transparent; transition: color 150ms var(--ease); }
  .pages a:hover { color: var(--text); }
  .pages a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }

  /* header */
  .top { padding: 48px 0 48px; }
  h1 {
    font: 700 52px/1.08 var(--display); letter-spacing: -0.03em;
    margin: 0 0 16px; text-wrap: balance;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 0; margin: 0; padding: 0; list-style: none; color: var(--text-3); font: 400 13px/20px var(--mono); }
  /* every item gets a leading dot; the first 24px are clipped, so no line ever starts with one */
  .meta { margin-left: -24px; clip-path: inset(-8px -8px -8px 24px); }
  .meta li::before { content: "\00b7"; display: inline-block; width: 24px; text-align: center; }
  .meta b { font-weight: 400; color: var(--text-2); }
  .meta a { color: var(--text-2); text-decoration: none; transition: color 150ms var(--ease); }
  .meta a:hover { color: var(--text); }

  /* layout */
  .layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 48px; align-items: start; }
  .side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px; }
  .search {
    width: 100%; height: 36px; padding: 0 12px;
    background: var(--sunk); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    font: 400 14px var(--sans);
    transition: border-color 150ms var(--ease);
  }
  .search::placeholder { color: var(--text-3); }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .tabs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .tabs a {
    display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px;
    border-radius: 8px; color: var(--text-2); text-decoration: none; font-size: 14px;
    transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .tabs a:hover { color: var(--text); background: var(--card); }
  .tabs a.on { color: var(--text); background: var(--raised); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
  .tabs a .i { color: var(--text-3); }
  .tabs a.on .i { color: var(--accent); }
  .tabs .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs .n { margin-left: auto; color: var(--text-3); font: 400 12px var(--mono); font-variant-numeric: tabular-nums; }
  .tabs .sep { height: 1px; background: var(--line); margin: 8px 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 4px; background: var(--text-3); }

  main { min-width: 0; animation: rise 400ms var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }

  .layout.solo { grid-template-columns: minmax(0, 1fr); }
  footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 13px; line-height: 20px; }
  .tile .val.none { color: var(--text-3); }
  .toc { list-style: none; margin: 8px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .toc a { display: block; padding: 4px 10px; border-radius: 6px; color: var(--text-3); text-decoration: none; font-size: 13px; line-height: 20px; transition: color 150ms var(--ease), background-color 150ms var(--ease); }
  .toc a:hover { color: var(--text); background: var(--card); }
  .tabs .main-tag { color: var(--accent); font: 400 11px var(--mono); }

  /* sections */
  section.block { margin-bottom: 56px; scroll-margin-top: 24px; }
  .block-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 16px; }
  .block-head h2 { font: 600 24px/1.25 var(--display); letter-spacing: -0.02em; margin: 0; }
  .block-head .sub { color: var(--text-3); font: 400 13px var(--mono); }
  .note { color: var(--text-3); font-size: 13px; line-height: 20px; margin: 12px 0 0; }
  .empty { color: var(--text-3); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; min-width: 0; }
  .card h3 { font: 500 15px/20px var(--sans); margin: 0 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
  .cards.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-items: start; }
  .grid > * { transition: border-color 600ms var(--ease), transform 180ms var(--ease); }
  .grid > .card:hover { border-color: var(--line-2); transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) { .grid > .card:hover { transform: none; } }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-3); }
  .mono { font-family: var(--mono); }

  /* hero: time to 60 + tiles */
  .hero {
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px 32px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 56px;
  }
  .label { margin: 0 0 8px; color: var(--text-3); font: 400 13px/20px var(--mono); }
  .big { margin: 0; font: 700 56px/1.05 var(--display); letter-spacing: -0.03em; }
  .big small { font: 500 17px/1 var(--sans); letter-spacing: 0; color: var(--text-2); margin-left: 6px; }
  .range { margin: 12px 0 0; color: var(--text-2); }
  .range b { color: var(--text); font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin: 16px 0 0; padding: 6px 10px; border-radius: 8px; background: var(--raised); color: var(--text-2); font-size: 13px; line-height: 20px; }
  .status .i { color: var(--accent); }
  details.how { margin-top: 16px; color: var(--text-2); font-size: 13px; line-height: 20px; }
  details.how summary { cursor: pointer; color: var(--text-3); font: 400 13px/20px var(--mono); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  details.how summary::-webkit-details-marker { display: none; }
  details.how summary .i { width: 14px; height: 14px; transition: transform 180ms var(--ease); }
  details.how[open] summary .i { transform: rotate(90deg); }
  details.how summary:hover { color: var(--text); }
  details.how p { margin: 8px 0 0; }
  details.how b { color: var(--text); font-weight: 500; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .tile .label { margin-bottom: 4px; }
  .tile .val { font: 600 28px/1.2 var(--display); letter-spacing: -0.02em; }
  .tile .val small { font: 500 14px var(--sans); color: var(--text-2); letter-spacing: 0; margin-left: 4px; }
  .tile .foot { margin: 6px 0 0; color: var(--text-3); font-size: 13px; line-height: 18px; overflow-wrap: anywhere; }
  .xpbar { position: relative; height: 8px; margin-top: 10px; border-radius: 4px; background: var(--raised); overflow: hidden; }
  .xpbar span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; }
  .xpbar .fill { background: var(--accent); }
  .xpbar .rest { background: rgba(227, 167, 63, 0.32); border-radius: 0 4px 4px 0; }
  .dotc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }

  /* charts */
  .chart-card { padding: 16px 16px 8px; }
  .chart-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin: 0 4px 8px; }
  .chart-head h3 { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; color: var(--text-2); font-size: 13px; line-height: 20px; }
  .legend li { display: inline-flex; align-items: center; gap: 8px; }
  .key { width: 16px; height: 0; border-top: 2px solid var(--accent); }
  .key.dash { border-top-style: dashed; }
  .key.ref { border-top-color: var(--text-3); }
  .key.band { height: 10px; border: 0; border-radius: 2px; background: rgba(239, 233, 222, 0.10); }
  .chart { position: relative; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid-l { stroke: var(--line); stroke-width: 1; }
  .chart .axis-t { fill: var(--text-3); font: 400 11px var(--mono); }
  .chart .s-you { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .s-fc { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 5; stroke-linecap: round; opacity: 0.8; }
  .chart .s-ref { fill: none; stroke: var(--text-3); stroke-width: 1.5; stroke-linejoin: round; }
  .chart .band { fill: rgba(239, 233, 222, 0.07); }
  .chart .end { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .chart .col { fill: var(--accent); }
  .chart .col.now { fill: rgba(227, 167, 63, 0.4); }
  .chart .col.dim { opacity: 0.35; }
  .chart .cross { stroke: var(--line-2); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: crosshair; }
  .chart .end-t { fill: var(--text); font: 500 12px var(--mono); }
  .tip {
    position: absolute; z-index: 3; pointer-events: none; min-width: 140px; max-width: 260px;
    padding: 8px 12px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line-2);
    color: var(--text); font: 400 12px/18px var(--mono); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .tip b { font-weight: 500; }
  .tip .t-m { color: var(--text-3); }
  .tip .sw { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: 3px; background: var(--accent); }
  .tip .sw.ref { background: var(--text-3); }

  /* tables */
  .table-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
  .tbl th { text-align: left; font: 400 12px/16px var(--mono); color: var(--text-3); padding: 0 12px 8px 0; white-space: nowrap; }
  .tbl td { padding: 9px 12px 9px 0; border-top: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tbl td.wrap { white-space: normal; min-width: 140px; }
  .tbl .r { text-align: right; }
  .tbl tr.cur td { color: var(--text-2); }
  .lvl { display: inline-block; min-width: 28px; padding: 0 6px; border-radius: 6px; background: var(--raised); color: var(--text); font: 500 12px/20px var(--mono); text-align: center; }
  .more { margin-top: 12px; height: 32px; padding: 0 12px; border-radius: 8px; background: transparent; color: var(--text-2); border: 1px solid var(--line-2); font: 400 12px var(--mono); cursor: pointer; transition: color 150ms var(--ease), background-color 150ms var(--ease); }
  .more:hover { color: var(--text); background: var(--raised); }

  /* bar lists (zones, kills, gold) */
  .bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .bars li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
  .bars .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .bars .nm small { color: var(--text-3); font: 400 12px var(--mono); margin-left: 8px; }
  .bars .v { color: var(--text-2); font: 400 13px var(--mono); font-variant-numeric: tabular-nums; }
  .bars .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
  .bars .track span { display: block; height: 100%; border-radius: 3px; background: var(--accent); min-width: 2px; }
  .tag-s { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 4px; background: var(--raised); color: var(--text-2); font: 400 11px/18px var(--mono); vertical-align: 1px; }

  /* small stat rows */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 24px; margin: 0 0 16px; }
  .stat .label { margin: 0 0 2px; }
  .stat .v { font: 600 22px/1.25 var(--display); letter-spacing: -0.01em; }
  .stat .v small { font: 500 13px var(--sans); color: var(--text-3); margin-left: 4px; letter-spacing: 0; }
  .gold-c { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gold-c i { font-style: normal; color: var(--text-3); margin: 0 3px 0 1px; }

  /* lists */
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; font-size: 14px; line-height: 20px; }
  .rows li:first-child { border-top: 0; padding-top: 0; }
  .rows .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .rows .when { flex: none; color: var(--text-3); font: 400 12px var(--mono); white-space: nowrap; }
  .rows .sub { color: var(--text-3); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { padding: 2px 8px; border-radius: 6px; background: var(--raised); color: var(--text-2); font-size: 12px; line-height: 20px; }
  .q { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; vertical-align: 1px; flex: none; }

  @media (max-width: 900px) {
    .shell { padding: 0 16px 48px; }
    .pages { padding-top: 24px; }
    .top { padding: 32px 0 32px; }
    h1 { font-size: 34px; }
    .meta { flex-direction: column; }
    .meta { margin-left: 0; clip-path: none; }
    .meta li::before { content: none; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .side { position: static; }
    .tabs { flex-direction: row; flex-wrap: wrap; gap: 8px; }
    .tabs a { height: 32px; border: 1px solid var(--line); }
    .tabs a .i { display: none; }
    .tabs .n { margin-left: 0; }
    .toc { display: none; }
    .hero { grid-template-columns: minmax(0, 1fr); padding: 20px 16px; margin-bottom: 40px; }
    .big { font-size: 44px; }
    section.block { margin-bottom: 40px; }
    .block-head h2 { font-size: 21px; }
    .card { padding: 14px 16px; }
    .table-wrap { margin: 0 -16px; padding: 0 16px; }
    .cards, .cards.two, .grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 340px) {
    .tiles { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 420px) {
    .tile { padding: 12px; }
    .tile .val { font-size: 24px; }
  }
  /* ---- shared by every page: header support block, search hint, motion ---- */
  [hidden] { display: none !important; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 48px; align-items: end; }
  .support { width: 320px; display: flex; flex-direction: column; gap: 12px; }
  .kofi {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px 14px 16px; border-radius: 12px;
    background: var(--accent); color: var(--on-accent); text-decoration: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition: background-color 150ms var(--ease), transform 150ms var(--ease);
  }
  .kofi:hover { background: var(--accent-hover); }
  .kofi:active { transform: translateY(1px); }
  .kofi:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .kofi .cup { width: 30px; height: 30px; stroke-width: 1.75; overflow: visible; }
  .kofi .steam { animation: steam 1.6s ease-in-out infinite paused; }
  .kofi .steam:nth-child(2) { animation-delay: 200ms; }
  .kofi .steam:nth-child(3) { animation-delay: 400ms; }
  .kofi:hover .steam, .kofi:focus-visible .steam { animation-play-state: running; }
  @keyframes steam { 50% { transform: translateY(-2px); opacity: 0.3; } }
  .kofi b { display: block; font: 700 16px/22px var(--sans); }
  .kofi small { display: block; font: 500 13px/18px var(--sans); opacity: 0.8; }
  .kofi .arrow { margin-left: auto; width: 18px; height: 18px; transition: transform 150ms var(--ease); }
  .kofi:hover .arrow { transform: translate(2px, -2px); }
  .hire { margin: 0; color: var(--text-2); font-size: 13px; line-height: 20px; }
  .hire b { color: var(--text); font-weight: 600; }
  .hire a { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .hire a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .find { position: relative; }
  .find .search { padding-right: 40px; }
  .find kbd {
    position: absolute; right: 8px; top: 8px; min-width: 20px; height: 20px; padding: 0 6px;
    border: 1px solid var(--line-2); border-radius: 4px; color: var(--text-3);
    font: 400 12px/18px var(--mono); text-align: center; pointer-events: none;
    transition: opacity 150ms var(--ease);
  }
  .find:focus-within kbd, .find .search:not(:placeholder-shown) ~ kbd { opacity: 0; }
  @media (hover: none) { .find kbd { display: none; } .find .search { padding-right: 12px; } }

  .enter { animation: card-in 420ms var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
  @keyframes card-in { from { opacity: 0; transform: translateY(8px); } }

  @media (prefers-reduced-motion: reduce) {
    .enter, .kofi .steam { animation: none; }
  }
  @media (max-width: 900px) {
    .top { grid-template-columns: minmax(0, 1fr); }
    .support { width: auto; }
  }
  /* ---- shared: avatar, live badge, embers ---- */
  .embers { position: absolute; left: 0; top: 0; width: 100%; height: 480px; pointer-events: none; z-index: 0; }
  .shell { position: relative; z-index: 1; }
  .who { display: flex; align-items: center; gap: 20px; margin: 0 0 16px; }
  .who h1 { margin: 0; min-width: 0; }
  .avatar {
    position: relative; flex: none; width: 72px; height: 72px; border-radius: 50%; overflow: hidden;
    background: var(--raised); box-shadow: 0 0 0 1px var(--line-2);
    transition: box-shadow 200ms var(--ease), transform 200ms var(--ease);
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 180ms var(--ease); }
  .avatar .av-alt { opacity: 0; }
  .avatar:hover .av-alt, .avatar:focus-visible .av-alt { opacity: 1; }
  .avatar:hover .av-main, .avatar:focus-visible .av-main { opacity: 0; }
  .avatar:hover { transform: rotate(-6deg) scale(1.05); }
  .avatar:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .is-live .avatar { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--bad); }

<script>
// Shared by every page (addons, macros, ...): avatar + live badge, support links,

    main.addEventListener("error", function () { av.hidden = true; });

  // ---- live badge (decapi.me answers without a Twitch key; checked every 2 minutes)

    cbox.hidden = false;
  }

  // "/" jumps to the search box (like opening chat in WoW), Esc clears it
  document.addEventListener("keydown", function (e) {
    var s = $("search"), t = e.target;
    if (!s) return;
    var typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
    if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault(); s.focus(); s.select();
    } else if (e.key === "Escape" && t === s) {
      s.value = ""; s.dispatchEvent(new Event("input")); s.blur();
    }
  });

  // Cards fade in one after another the first time they are shown
  if (!still) {
    Array.prototype.forEach.call(document.querySelectorAll(".grid"), function (grid) {
      Array.prototype.forEach.call(grid.children, function (card, i) {
        card.style.setProperty("--i", Math.min(i, 14));
        card.classList.add("enter");
        card.addEventListener("animationend", function done(ev) {
          if (ev.target !== card) return;
          card.classList.remove("enter"); card.style.removeProperty("--i");
          card.removeEventListener("animationend", done);
        });
      });
    });
  }

  // ---- embers drifting up behind the header (paused when not visible)
  var cv = $("embers");
  if (cv && cv.getContext && !still) {
    var ctx = cv.getContext("2d"), W = 0, H = 0, parts = [], running = false, seen = true, last = 0;
    var COLORS = ["227,167,63", "242,191,98", "232,135,58"];
    var spawn = function (anywhere) {
      return {
        x: Math.random() * W, y: anywhere ? Math.random() * H : H + 8,
        r: 0.8 + Math.random() * 1.6, v: 10 + Math.random() * 24,
        sway: 6 + Math.random() * 18, ph: Math.random() * 6.283, f: 0.6 + Math.random() * 1.4,
        c: COLORS[(Math.random() * COLORS.length) | 0], a: 0.35 + Math.random() * 0.5
      };
    };
    var fit = function () {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var want = Math.max(14, Math.min(44, Math.round(W / 32)));
      while (parts.length < want) parts.push(spawn(true));
      parts.length = want;
    };
    var frame = function (t) {
      if (!running) return;
      var dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
      last = t;
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.y -= p.v * dt; p.ph += p.f * dt;
        if (p.y < -8) p = parts[i] = spawn(false);
        var fade = Math.max(0, Math.min(1, p.y / (H * 0.6))) * Math.max(0, Math.min(1, (H - p.y) / 60));
        ctx.globalAlpha = p.a * fade * (0.75 + 0.25 * Math.sin(p.ph * 3.1));
        ctx.fillStyle = "rgb(" + p.c + ")";
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(p.ph) * p.sway, p.y, p.r, 0, 6.283);
        ctx.fill();
      }
      requestAnimationFrame(frame);
    };
    var play = function () {
      var go = seen && !document.hidden;
      if (go && !running) { running = true; last = 0; requestAnimationFrame(frame); }
      if (!go) running = false;
    };
    fit();
    window.addEventListener("resize", fit);
    document.addEventListener("visibilitychange", play);
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (en) { seen = en[0].isIntersecting; play(); }).observe(cv);
    }
    play();
  }
})();
</script>
</body>
</html>
