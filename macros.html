<style>
  :root {
    --sunk: #12110f;
    --bg: #161513;
    --card: #1c1a18;
    --raised: #262421;
    --line: rgba(239, 233, 222, 0.08);
    --line-2: rgba(239, 233, 222, 0.16);
    --text: #efe9de;
    --text-2: #aaa398;
    --text-3: #8a847a;
    --accent: #e3a73f;
    --accent-hover: #ecb556;
    --on-accent: #1b1509;
    --cond: #9fb4c7;
    --good: #4cc38a;
    --bad: #e5484d;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --display: "Montserrat", system-ui, sans-serif;
    --sans: "Montserrat", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/24px var(--sans); }
  a { color: inherit; }
  [hidden] { display: none !important; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .shell { max-width: 1200px; margin: 0 auto; padding: 0 32px 64px; }

  /* page switch (shared with the addon page) */
  .pages { display: flex; gap: 24px; padding-top: 32px; font: 400 13px/20px var(--mono); }
  .pages a { color: var(--text-3); text-decoration: none; padding-bottom: 4px; border-bottom: 2px solid transparent; transition: color 150ms var(--ease); }
  .pages a:hover { color: var(--text); }
  .pages a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }

  /* header */
  .top { padding: 48px 0 48px; }
  h1 {
    font: 700 52px/1.08 var(--display); letter-spacing: -0.03em;
    margin: 0 0 16px; text-wrap: balance;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 0; margin: 0; padding: 0; list-style: none; color: var(--text-3); font: 400 13px/20px var(--mono); }
  /* every item gets a leading dot; the first 24px are clipped, so no line ever starts with one */
  .meta { margin-left: -24px; clip-path: inset(-8px -8px -8px 24px); }
  .meta li::before { content: "\00b7"; display: inline-block; width: 24px; text-align: center; }
  .meta b { font-weight: 400; color: var(--text-2); }
  .meta a { color: var(--text-2); text-decoration: none; transition: color 150ms var(--ease); }
  .meta a:hover { color: var(--text); }

  /* layout */
  .layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 48px; align-items: start; }
  .side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px; }
  .search {
    width: 100%; height: 36px; padding: 0 12px;
    background: var(--sunk); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    font: 400 14px var(--sans);
    transition: border-color 150ms var(--ease);
  }
  .search::placeholder { color: var(--text-3); }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .tabs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .tabs a {
    display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px;
    border-radius: 8px; color: var(--text-2); text-decoration: none; font-size: 14px;
    transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .tabs a:hover { color: var(--text); background: var(--card); }
  .tabs a.on { color: var(--text); background: var(--raised); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
  .tabs a .i { color: var(--text-3); }
  .tabs a.on .i { color: var(--accent); }
  .tabs .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs .n { margin-left: auto; color: var(--text-3); font: 400 12px var(--mono); font-variant-numeric: tabular-nums; }
  .tabs .sep { height: 1px; background: var(--line); margin: 8px 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 4px; background: var(--text-3); }

  main { min-width: 0; animation: rise 400ms var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }

  /* this week */
  .changes {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 24px 12px; margin-bottom: 48px;
  }
  .changes h2 { display: flex; align-items: center; gap: 10px; font: 500 15px/20px var(--sans); margin: 0 0 8px; }
  .changes h2 .i { color: var(--accent); }
  .changes ol { list-style: none; margin: 0; padding: 0; }
  .changes li {
    display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    min-height: 40px; border-top: 1px solid var(--line);
  }
  .changes li:first-child { border-top: 0; }
  .tag { font: 400 12px var(--mono); }
  .tag.added { color: var(--good); }
  .tag.removed { color: var(--bad); }
  .tag.edited { color: var(--accent); }
  .changes .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .changes a.what { text-decoration: none; font-weight: 500; }
  .changes a.what:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
  .changes span.what { color: var(--text-3); }
  .changes .where { color: var(--text-3); font-weight: 400; }
  .changes .when { color: var(--text-3); font: 400 12px var(--mono); white-space: nowrap; }

  /* groups */
  section.group { margin-bottom: 56px; scroll-margin-top: 24px; }
  .group-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 16px; }
  .group-head h2 { font: 600 24px/1.25 var(--display); letter-spacing: -0.02em; margin: 0; }
  .group-head .sub { color: var(--text-3); font: 400 13px var(--mono); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; align-items: start; }
  .macro {
    display: flex; flex-direction: column; gap: 12px; min-width: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 12px 12px 16px; scroll-margin-top: 24px;
    transition: border-color 600ms var(--ease), transform 180ms var(--ease);
  }
  .macro:hover { border-color: var(--line-2); transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) { .macro:hover { transform: none; } }
  .macro.flash { border-color: var(--accent); transition-duration: 150ms; }
  .macro-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .icon {
    width: 32px; height: 32px; flex: none; border-radius: 6px; overflow: hidden;
    background: var(--raised); border: 1px solid var(--line-2);
    display: grid; place-items: center; color: var(--text-3); font: 400 13px var(--mono);
  }
  .icon img { width: 100%; height: 100%; display: block; }
  .name { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name.untitled { color: var(--text-3); font-weight: 400; }
  .new.edited { color: var(--accent); }
  .link-btn { width: 28px; padding: 0; justify-content: center; }
  .link-btn + .copy { margin-left: -4px; }
  .tabs a.cls.on { box-shadow: inset 3px 0 0 var(--cls), inset 0 1px 0 rgba(255, 255, 255, 0.06); }
  .group-head.cls h2 { position: relative; padding-left: 14px; }
  .group-head.cls h2::before { content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 4px; border-radius: 2px; background: var(--cls); }
  .new { color: var(--good); font: 400 12px var(--mono); flex: none; }
  .copy {
    margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: 6px;
    background: transparent; color: var(--text-2); border: 1px solid var(--line-2);
    font: 400 12px var(--mono); cursor: pointer;
    transition: color 150ms var(--ease), border-color 150ms var(--ease), background-color 150ms var(--ease);
  }
  .copy .i { width: 14px; height: 14px; }
  .copy:hover { color: var(--text); background: var(--raised); }
  .copy:active { transform: translateY(1px); }
  .copy.done { color: var(--good); border-color: rgba(76, 195, 138, 0.4); }
  pre.body {
    margin: 0; padding: 12px 14px; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font: 400 13px/20px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
    tab-size: 4;
  }
  pre.body .cmd { color: var(--accent); }
  pre.body .meta-line { color: var(--text-2); }
  pre.body .cond { color: var(--cond); }
  pre.body .sep { color: var(--text-3); }
  pre.body.empty { color: var(--text-3); }

  .empty { color: var(--text-3); margin: 0; }
  footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 13px; }

  @media (max-width: 900px) {
    .shell { padding: 0 16px 48px; }
    .pages { padding-top: 24px; }
    .top { padding: 32px 0 32px; }
    h1 { font-size: 34px; }
    .meta { flex-direction: column; }
    .meta { margin-left: 0; clip-path: none; }
    .meta li::before { content: none; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .side { position: static; }
    .tabs { flex-direction: row; flex-wrap: wrap; gap: 8px; }
    .tabs a { height: 32px; border: 1px solid var(--line); }
    .tabs a .i { display: none; }
    .tabs .n { margin-left: 0; }
    .tabs .sep { display: none; }
    .changes { padding: 16px 16px 8px; margin-bottom: 40px; }
    .changes li { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; }
    section.group { margin-bottom: 40px; }
    .group-head h2 { font-size: 21px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
  /* ---- shared by every page: header support block, search hint, motion ---- */
  [hidden] { display: none !important; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 48px; align-items: end; }
  .support { width: 320px; display: flex; flex-direction: column; gap: 12px; }
  .kofi {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px 14px 16px; border-radius: 12px;
    background: var(--accent); color: var(--on-accent); text-decoration: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition: background-color 150ms var(--ease), transform 150ms var(--ease);
  }
  .kofi:hover { background: var(--accent-hover); }
  .kofi:active { transform: translateY(1px); }
  .kofi:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .kofi .cup { width: 30px; height: 30px; stroke-width: 1.75; overflow: visible; }
  .kofi .steam { animation: steam 1.6s ease-in-out infinite paused; }
  .kofi .steam:nth-child(2) { animation-delay: 200ms; }
  .kofi .steam:nth-child(3) { animation-delay: 400ms; }
  .kofi:hover .steam, .kofi:focus-visible .steam { animation-play-state: running; }
  @keyframes steam { 50% { transform: translateY(-2px); opacity: 0.3; } }
  .kofi b { display: block; font: 700 16px/22px var(--sans); }
  .kofi small { display: block; font: 500 13px/18px var(--sans); opacity: 0.8; }
  .kofi .arrow { margin-left: auto; width: 18px; height: 18px; transition: transform 150ms var(--ease); }
  .kofi:hover .arrow { transform: translate(2px, -2px); }
  .hire { margin: 0; color: var(--text-2); font-size: 13px; line-height: 20px; }
  .hire b { color: var(--text); font-weight: 600; }
  .hire a { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .hire a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .find { position: relative; }
  .find .search { padding-right: 40px; }
  .find kbd {
    position: absolute; right: 8px; top: 8px; min-width: 20px; height: 20px; padding: 0 6px;
    border: 1px solid var(--line-2); border-radius: 4px; color: var(--text-3);
    font: 400 12px/18px var(--mono); text-align: center; pointer-events: none;
    transition: opacity 150ms var(--ease);
  }
  .find:focus-within kbd, .find .search:not(:placeholder-shown) ~ kbd { opacity: 0; }
  @media (hover: none) { .find kbd { display: none; } .find .search { padding-right: 12px; } }

  .enter { animation: card-in 420ms var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
  @keyframes card-in { from { opacity: 0; transform: translateY(8px); } }

  @media (prefers-reduced-motion: reduce) {
    .enter, .kofi .steam { animation: none; }
  }
  @media (max-width: 900px) {
    .top { grid-template-columns: minmax(0, 1fr); }
    .support { width: auto; }
  }
  /* ---- shared: avatar, live badge, embers ---- */
  .embers { position: absolute; left: 0; top: 0; width: 100%; height: 480px; pointer-events: none; z-index: 0; }
  .shell { position: relative; z-index: 1; }
  .who { display: flex; align-items: center; gap: 20px; margin: 0 0 16px; }
  .who h1 { margin: 0; min-width: 0; }
  .avatar {
    position: relative; flex: none; width: 72px; height: 72px; border-radius: 50%; overflow: hidden;
    background: var(--raised); box-shadow: 0 0 0 1px var(--line-2);
    transition: box-shadow 200ms var(--ease), transform 200ms var(--ease);
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 180ms var(--ease); }
  .avatar .av-alt { opacity: 0; }
  .avatar:hover .av-alt, .avatar:focus-visible .av-alt { opacity: 1; }
  .avatar:hover .av-main, .avatar:focus-visible .av-main { opacity: 0; }
  .avatar:hover { transform: rotate(-6deg) scale(1.05); }
  .avatar:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .is-live .avatar { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--bad); }
  .live {
    display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 10px; margin: 0 0 16px;
    border-radius: 999px; background: rgba(229, 72, 77, 0.14); color: var(--text-2); text-decoration: none;
    font: 500 13px/1 var(--sans); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background-color 150ms var(--ease);
  }
  .live:hover { background: rgba(229, 72, 77, 0.24); }
  .live b { font-weight: 700; color: #ff7a7e; }
  .live-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--bad); animation: live-dot 2s ease-in-out infinite; }
  @keyframes live-dot { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
    .avatar:hover { transform: none; }
  }
  @media (max-width: 900px) {
    .who { gap: 16px; }
    .avatar { width: 56px; height: 56px; }
  }
  /* ---- shared: chat commands (config.json "commands") ---- */
  .cmds { margin-top: 56px; }
  .cmds h2 { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font: 500 15px/20px var(--sans); margin: 0 0 12px; }
  .cmds h2 .i { color: var(--accent); }
  .cmds h2 small { color: var(--text-3); font: 400 13px/20px var(--mono); }
  .cmds ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 32px; }
  .cmds li { display: flex; align-items: baseline; gap: 12px; min-width: 0; padding: 10px 0; border-top: 1px solid var(--line); }
  .cmds code {
    flex: none; padding: 2px 8px; border-radius: 6px; background: var(--raised); color: var(--text);
    font: 500 13px/20px var(--mono); box-shadow: inset 0 0 0 1px var(--line);
  }
  .cmds li span { min-width: 0; color: var(--text-2); font-size: 14px; line-height: 20px; }
  .cmds li.here code { box-shadow: inset 0 0 0 1px var(--accent); }
</style>

  // Copies a link that opens this exact macro (handy to paste in chat)
  function linkButton(card, m) {
    var b = el("button", "copy link-btn"); b.type = "button";
    b.title = "Copy link to this macro";
    b.setAttribute("aria-label", "Copy a link to macro " + shownName(m.name));
    b.appendChild(icon("link"));
    var timer;
    b.addEventListener("click", function () {
      copyText(location.href.split("#")[0] + "#" + card.id, function (ok) {
        b.textContent = ""; b.appendChild(icon(ok ? "check" : "link")); b.classList.toggle("done", ok);
        clearTimeout(timer);
        timer = setTimeout(function () { b.textContent = ""; b.appendChild(icon("link")); b.classList.remove("done"); }, 1600);
      });
    });
    return b;
  }
  function copyButton(m) {
    var b = el("button", "copy"); b.type = "button";
    b.setAttribute("aria-label", "Copy macro " + shownName(m.name));
    function set(state) {
      b.textContent = "";
      b.appendChild(icon(state === "done" ? "check" : "copy"));
      b.appendChild(document.createTextNode(state === "done" ? "Copied" : state === "fail" ? "Select it" : "Copy"));
      b.classList.toggle("done", state === "done");
    }
    set("idle");
    var timer;
    b.addEventListener("click", function () {
      copyText(m.body || "", function (ok) {
        set(ok ? "done" : "fail");
        clearTimeout(timer); timer = setTimeout(function () { set("idle"); }, 1600);
      });
    });
    return b;
  }

  var list = $("list"), sections = {}, rows = [];
  groups.forEach(function (g) {
    var sec = el("section", "group"); sec.id = g.id; sec.hidden = true;
    var head = el("div", "group-head");
    var cc = g.kind === "character" && CLASS[String(g.cls || "").toLowerCase()];
    if (cc) { head.classList.add("cls"); head.style.setProperty("--cls", cc); }
    head.appendChild(el("h2", null, g.label));
    var bits = [];
    if (g.realm) bits.push(g.realm);
    if (g.cls) bits.push(g.cls);
    if (g.kind === "general") bits.push("shared by every character");
    if (g.lastPlayed) bits.push("played last");
    if (bits.length) head.appendChild(el("span", "sub", bits.join(" · ")));
    sec.appendChild(head);
    var grid = el("div", "grid");
    g.macros.forEach(function (m) {
      var card = el("article", "macro"); card.id = cardId(g.id, m.key);
      var top = el("div", "macro-head");
      top.appendChild(iconBox(m));
      top.appendChild(el("span", "name" + (blank(m.name) ? " untitled" : ""), shownName(m.name)));
      if (fresh[g.id + "\u0001" + m.key]) top.appendChild(el("span", "new", "New"));
      else if (edited[g.id + "\u0001" + m.key]) top.appendChild(el("span", "new edited", "Edited"));
      top.appendChild(linkButton(card, m));
      top.appendChild(copyButton(m));
      card.appendChild(top);
      card.appendChild(renderBody(m.body || "", el("pre", "body")));
      grid.appendChild(card);
      rows.push({ card: card, sec: sec, text: (shownName(m.name) + "\n" + (m.body || "")).toLowerCase() });
    });
    sec.appendChild(grid);
    list.appendChild(sec);
    sections[g.id] = sec;
  });

  $("side").hidden = groups.length === 0;
  if (!groups.length) { $("none").textContent = "No macros to show yet"; $("none").hidden = false; }

  // ------------------------------------------------------------ tab switching (#general, #c-name-realm, #m-...)
  var current = null;
  function show(id) {
    if (!byId[id]) id = groups.length ? groups[0].id : null;
    current = id;
    Object.keys(sections).forEach(function (k) { sections[k].hidden = k !== id; });
    Object.keys(links).forEach(function (k) { links[k].classList.toggle("on", k === id); });
  }
  function fromHash(scroll) {
    var h = decodeURIComponent(location.hash.slice(1));
    var card = h.indexOf("m-") === 0 ? document.getElementById(h) : null;
    if (card) {
      show(card.closest("section").id);
      if (scroll) {
        card.scrollIntoView({ block: "center" });
        card.classList.add("flash");
        setTimeout(function () { card.classList.remove("flash"); }, 1600);
      }
    } else show(h);
  }
  window.addEventListener("hashchange", function () {
    if ($("search").value) { $("search").value = ""; filter(""); }
    fromHash(true);
  });
  fromHash(false);
  if (location.hash.indexOf("#m-") === 0) setTimeout(function () { fromHash(true); }, 50);

  // ------------------------------------------------------------ this week panel
  if (shownChanges.length) {
    var box = $("changes");
    var h = el("h2"); h.appendChild(icon("history")); h.appendChild(document.createTextNode("This week"));
    box.appendChild(h);
    var ol = el("ol");
    shownChanges.forEach(function (e) {
      var li = el("li"), g = byId[e.group];
      var label = e.type === "added" ? "Added" : e.type === "removed" ? "Removed" : "Edited";
      li.appendChild(el("span", "tag " + e.type, label));
      var where = groups.length > 1 ? " · " + (g ? g.label : (e.groupLabel || "")) : "";
      if (e.type !== "removed" && g) {
        var a = el("a", "what", shownName(e.name)); a.href = "#" + cardId(g.id, e.key);
        if (where) a.appendChild(el("span", "where", where));
        li.appendChild(a);
      } else {
        li.appendChild(el("span", "what", shownName(e.name) + (e.groupLabel && groups.length > 1 ? " · " + e.groupLabel : "")));
      }
      li.appendChild(el("span", "when", ago(e.at)));
      ol.appendChild(li);
    });
    box.appendChild(ol);
    box.hidden = false;
  }

  // ------------------------------------------------------------ search across every tab
  function filter(q) {
    q = q.trim().toLowerCase();
    if (!q) {
      rows.forEach(function (r) { r.card.hidden = false; });
      show(current);
      $("changes").hidden = !shownChanges.length;
      $("none").hidden = groups.length > 0;
      return;
    }
    var live = {}, shown = 0;
    rows.forEach(function (r) {
      var ok = r.text.indexOf(q) >= 0;
      r.card.hidden = !ok;
      if (ok) { shown++; live[r.sec.id] = true; }
    });
    Object.keys(sections).forEach(function (k) { sections[k].hidden = !live[k]; });
    Object.keys(links).forEach(function (k) { links[k].classList.remove("on"); });
    $("changes").hidden = true;
    $("none").hidden = shown > 0;
  }
  $("search").addEventListener("input", function (e) { filter(e.target.value); });
})();
</script>
<script>
// Shared by every page (addons, macros, ...): avatar + live badge, support links,
// "/" to search, card entrance, header embers.
(function () {
  "use strict";
  var D = window.ADDON_DATA || window.MACRO_DATA || window.JOURNEY_DATA || {};
  var S = D.support || {};
  var $ = function (id) { return document.getElementById(id); };
  function url(u) { u = String(u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
  var still = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  // ---- avatar: links to Twitch, swaps picture on hover, and now and then shows the rare one
  var tw = url(D.twitchUrl), chan = (/twitch\.tv\/([A-Za-z0-9_]{3,25})/i.exec(tw) || [])[1];
  var av = $("avatar");
  if (av && tw) {
    var main = av.querySelector(".av-main");
    av.href = tw;
    av.title = tw.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, "");
    av.setAttribute("aria-label", (chan || "My channel") + " on Twitch");
    if (Math.random() < 1 / 12) main.src = "assets/avatar-blur.png";
    main.addEventListener("error", function () { av.hidden = true; });
    av.hidden = false;
  }

  // ---- live badge (decapi.me answers without a Twitch key; checked every 2 minutes)
  var live = $("live");
  function short(t) {
    var d = /(\d+)\s*day/.exec(t), h = /(\d+)\s*hour/.exec(t), m = /(\d+)\s*minute/.exec(t);
    var hours = (d ? +d[1] * 24 : 0) + (h ? +h[1] : 0), mins = m ? +m[1] : 0;
    return hours ? hours + "h " + mins + "m" : mins ? mins + "m" : "just started";
  }
  function grab(u) { return fetch(u, { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }); }
  function setLive(on, info) {
    live.hidden = !on;
    var top = document.querySelector(".top");
    if (top) top.classList.toggle("is-live", on);
    if (on) $("live-info").textContent = info;
  }
  function check() {
    if (document.hidden) return;
    var base = "https://decapi.me/twitch/";
    grab(base + "uptime/" + chan).then(function (up) {
      up = up.trim();
      // Offline reads "<name> is offline"; errors carry no time, so they count as offline too
      var on = !/offline/i.test(up) && /\d+\s*(day|hour|minute|second)/i.test(up);
      if (!on) { setLive(false); return; }
      return grab(base + "game/" + chan).then(function (game) {
        game = game.trim();
        if (game.length > 48 || /error|not found|invalid/i.test(game)) game = "";
        setLive(true, (game ? " \u00b7 " + game : "") + " \u00b7 " + short(up));
      });
    }).catch(function () { });
  }
  if (live && chan && window.fetch) {
    live.href = tw;
    check();
    setInterval(check, 120000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
  }

  var kofi = url(S.kofiUrl), tree = url(S.linktreeUrl), hire = String(S.commissions || "").trim();

  if (kofi) {
    $("kofi").href = kofi;
    $("kofi-note").textContent = S.kofiNote || "Every tip helps the stream";
    $("kofi").hidden = false;
  }
  if (hire) {
    var p = $("hire"), b = document.createElement("b");
    b.textContent = "Open for commissions. ";
    p.appendChild(b);
    p.appendChild(document.createTextNode(hire));
    if (tree) {
      var a = document.createElement("a");
      a.href = tree; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Get in touch";
      p.appendChild(document.createTextNode(" "));
      p.appendChild(a);
    }
    p.hidden = false;
  }
  $("support").hidden = !(kofi || hire);
  if (tree && $("meta")) {
    var li = document.createElement("li"), l = document.createElement("a");
    l.href = tree; l.textContent = tree.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, "");
    li.appendChild(l); $("meta").appendChild(li);
  }

  // ---- chat commands: one list in config.json, shown the same way on every page
  var cmds = D.commands;
  cmds = Array.isArray(cmds) ? cmds : (cmds && Array.isArray(cmds.value) ? cmds.value : []);
  var cbox = $("cmds");
  if (cbox && cmds.length) {
    var here = (location.pathname.split("/").pop() || "index.html").toLowerCase();
    var mine = { "index.html": "!addons", "macros.html": "!macros", "journey.html": "!journey" }[here];
    var h2 = document.createElement("h2");
    h2.innerHTML = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
    h2.appendChild(document.createTextNode("Chat commands"));
    var sm = document.createElement("small");
    sm.textContent = chan ? "type them in twitch.tv/" + chan : "type them in my Twitch chat";
    h2.appendChild(sm);
    var ul = document.createElement("ul");
    cmds.forEach(function (c) {
      if (!c || !c.command) return;
      var li = document.createElement("li"), code = document.createElement("code"), sp = document.createElement("span");
      code.textContent = c.command; sp.textContent = c.text || "";
      if (String(c.command).toLowerCase() === mine) { li.className = "here"; sp.textContent += " (this page)"; }
      li.appendChild(code); li.appendChild(sp); ul.appendChild(li);
    });
    cbox.appendChild(h2); cbox.appendChild(ul);
    cbox.hidden = false;
  }

  // "/" jumps to the search box (like opening chat in WoW), Esc clears it
  document.addEventListener("keydown", function (e) {
    var s = $("search"), t = e.target;
    if (!s) return;
    var typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
    if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault(); s.focus(); s.select();
    } else if (e.key === "Escape" && t === s) {
      s.value = ""; s.dispatchEvent(new Event("input")); s.blur();
    }
  });

  // Cards fade in one after another the first time they are shown
  if (!still) {
    Array.prototype.forEach.call(document.querySelectorAll(".grid"), function (grid) {
      Array.prototype.forEach.call(grid.children, function (card, i) {
        card.style.setProperty("--i", Math.min(i, 14));
        card.classList.add("enter");
        card.addEventListener("animationend", function done(ev) {
          if (ev.target !== card) return;
          card.classList.remove("enter"); card.style.removeProperty("--i");
          card.removeEventListener("animationend", done);
        });
      });
    });
  }

  // ---- embers drifting up behind the header (paused when not visible)
  var cv = $("embers");
  if (cv && cv.getContext && !still) {
    var ctx = cv.getContext("2d"), W = 0, H = 0, parts = [], running = false, seen = true, last = 0;
    var COLORS = ["227,167,63", "242,191,98", "232,135,58"];
    var spawn = function (anywhere) {
      return {
        x: Math.random() * W, y: anywhere ? Math.random() * H : H + 8,
        r: 0.8 + Math.random() * 1.6, v: 10 + Math.random() * 24,
        sway: 6 + Math.random() * 18, ph: Math.random() * 6.283, f: 0.6 + Math.random() * 1.4,
        c: COLORS[(Math.random() * COLORS.length) | 0], a: 0.35 + Math.random() * 0.5
      };
    };
    var fit = function () {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var want = Math.max(14, Math.min(44, Math.round(W / 32)));
      while (parts.length < want) parts.push(spawn(true));
      parts.length = want;
    };
    var frame = function (t) {
      if (!running) return;
      var dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
      last = t;
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.y -= p.v * dt; p.ph += p.f * dt;
        if (p.y < -8) p = parts[i] = spawn(false);
        var fade = Math.max(0, Math.min(1, p.y / (H * 0.6))) * Math.max(0, Math.min(1, (H - p.y) / 60));
        ctx.globalAlpha = p.a * fade * (0.75 + 0.25 * Math.sin(p.ph * 3.1));
        ctx.fillStyle = "rgb(" + p.c + ")";
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(p.ph) * p.sway, p.y, p.r, 0, 6.283);
        ctx.fill();
      }
      requestAnimationFrame(frame);
    };
    var play = function () {
      var go = seen && !document.hidden;
      if (go && !running) { running = true; last = 0; requestAnimationFrame(frame); }
      if (!go) running = false;
    };
    fit();
    window.addEventListener("resize", fit);
    document.addEventListener("visibilitychange", play);
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (en) { seen = en[0].isIntersecting; play(); }).observe(cv);
    }
    play();
  }
})();
</script>
