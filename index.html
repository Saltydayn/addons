<title>Addons</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sunk: #12110f;
    --bg: #161513;
    --card: #1c1a18;
    --raised: #262421;
    --line: rgba(239, 233, 222, 0.08);
    --line-2: rgba(239, 233, 222, 0.16);
    --text: #efe9de;
    --text-2: #aaa398;
    --text-3: #8a847a;
    --accent: #e3a73f;
    --good: #4cc38a;
    --bad: #e5484d;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --serif: "Fraunces", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/22px var(--sans); }
  a { color: inherit; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .shell { max-width: 1200px; margin: 0 auto; padding: 0 32px 64px; }

  /* page switch (shared with the macro page) */
  .pages { display: flex; gap: 24px; padding-top: 32px; font: 400 13px/20px var(--mono); }
  .pages a { color: var(--text-3); text-decoration: none; padding-bottom: 4px; border-bottom: 2px solid transparent; transition: color 150ms var(--ease); }
  .pages a:hover { color: var(--text); }
  .pages a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }

  /* header */
  .top { padding: 48px 0 48px; }
  h1 {
    font: 400 56px/1.05 var(--serif); letter-spacing: -0.02em;
    margin: 0 0 16px; font-variation-settings: "opsz" 144;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 0; margin: 0; padding: 0; list-style: none; color: var(--text-3); font: 400 13px/20px var(--mono); }
  .meta li + li::before { content: "\00b7"; margin: 0 10px; }
  .meta b { font-weight: 400; color: var(--text-2); }
  .meta a { color: var(--text-2); text-decoration: none; transition: color 150ms var(--ease); }
  .meta a:hover { color: var(--text); }

  /* layout */
  .layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 48px; align-items: start; }
  .side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px; }
  .search {
    width: 100%; height: 36px; padding: 0 12px;
    background: var(--sunk); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    font: 400 14px var(--sans);
    transition: border-color 150ms var(--ease);
  }
  .search::placeholder { color: var(--text-3); }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .cats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .cats a {
    display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px;
    border-radius: 8px; color: var(--text-2); text-decoration: none; font-size: 14px;
    transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .cats a:hover { color: var(--text); background: var(--card); }
  .cats a.on { color: var(--text); background: var(--raised); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
  .cats a .i { color: var(--text-3); }
  .cats a.on .i { color: var(--accent); }
  .cats .n { margin-left: auto; color: var(--text-3); font: 400 12px var(--mono); font-variant-numeric: tabular-nums; }

  main { min-width: 0; animation: rise 400ms var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }

  /* this week */
  .changes {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 24px 12px; margin-bottom: 48px;
  }
  .changes h2 { display: flex; align-items: center; gap: 10px; font: 500 15px/20px var(--sans); margin: 0 0 8px; }
  .changes h2 .i { color: var(--accent); }
  .changes ol { list-style: none; margin: 0; padding: 0; }
  .changes li {
    display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    min-height: 40px; border-top: 1px solid var(--line);
  }
  .changes li:first-child { border-top: 0; }
  .tag { font: 400 12px var(--mono); }
  .tag.added { color: var(--good); }
  .tag.removed { color: var(--bad); }
  .changes .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .changes a.what { text-decoration: none; font-weight: 500; }
  .changes a.what:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
  .changes span.what { color: var(--text-3); }
  .changes .when { color: var(--text-3); font: 400 12px var(--mono); white-space: nowrap; }

  /* categories */
  section.cat { margin-bottom: 56px; scroll-margin-top: 24px; }
  .cat-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; }
  .cat-head h2 { font: 400 28px/1.2 var(--serif); margin: 0; font-variation-settings: "opsz" 48; }
  .cat-head .n { color: var(--text-3); font: 400 13px var(--mono); }
  details.hood > summary { list-style: none; cursor: pointer; }
  details.hood > summary::-webkit-details-marker { display: none; }
  details.hood > summary .chev { align-self: center; color: var(--text-3); transition: transform 180ms var(--ease); }
  details.hood[open] > summary .chev { transform: rotate(90deg); }
  details.hood > summary:hover h2 { color: var(--text); }
  details.hood:not([open]) > summary h2 { color: var(--text-2); }
  .hood-note { color: var(--text-3); font-size: 13px; margin: -8px 0 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .addon {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px;
    scroll-margin-top: 24px;
    transition: border-color 180ms var(--ease), background-color 180ms var(--ease);
  }
  .addon:hover { border-color: var(--line-2); }
  .addon.flash { border-color: var(--accent); }
  .addon-head { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 500; font-size: 16px; line-height: 22px; overflow-wrap: anywhere; }
  .ver { color: var(--text-3); font: 400 12px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .new { margin-left: auto; color: var(--good); font: 400 12px var(--mono); white-space: nowrap; }
  .desc { color: var(--text-2); font-size: 14px; line-height: 20px; margin: 0; overflow-wrap: anywhere; }
  .mods { color: var(--text-3); font-size: 13px; line-height: 20px; margin: 0; }
  .foot { margin-top: auto; padding-top: 4px; }
  .link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent); font-size: 14px; text-decoration: none;
  }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .link .i { width: 14px; height: 14px; }

  .empty { color: var(--text-2); }
  footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 13px; line-height: 20px; }

  @media (max-width: 900px) {
    .shell { padding: 0 16px 48px; }
    .pages { padding-top: 24px; }
    .top { padding: 32px 0 32px; }
    h1 { font-size: 40px; }
    .meta { flex-direction: column; }
    .meta li + li::before { content: none; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 32px; }
    .side { position: static; }
    .cats { flex-direction: row; flex-wrap: wrap; gap: 8px; }
    .cats a { height: 32px; border: 1px solid var(--line); }
    .cats .n { margin-left: 0; }
    .changes { padding: 16px 16px 8px; margin-bottom: 40px; }
    .changes li { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; }
    section.cat { margin-bottom: 40px; }
    .cat-head h2 { font-size: 24px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>

    "atlaslootclassic": [GE, "Loot tables for every dungeon and raid"],
    "pawn": [GE, "Tells you which items are upgrades for your character"],
    "itemrack": [GE, "Save gear sets and swap them with one click"],
    "outfitter": [GE, "Gear sets with automatic swapping"],
    "trinketmenu": [GE, "Quick menu for swapping trinkets"],
    "tacotip": [GE, "Gear score and talents in player tooltips"],
    "gathermate2": [GE, "Remembers herb, ore and fishing spots and shows them on the map"],
    "gatherer": [GE, "Remembers herb and ore spots and shows them on the map"],
    "vendorprice": [GE, "Vendor sell prices in item tooltips"],
    "fishingbuddy": [GE, "Fishing helper with outfit swaps, easy casting and a catch log"],

    "leatrix_plus": [QL, "Dozens of small quality-of-life tweaks in one addon"],
    "postal": [QL, "Mailbox upgrades like opening all mail at once"],
    "lfgbulletinboard": [QL, "Collects group requests from chat into one list"],
    "novaworldbuffs": [QL, "Tracks world buff timers like Onyxia and Rend"],
    "novainstancetracker": [QL, "Tracks dungeon lockouts and the hourly instance limit"],

    "!buggrabber": [HOOD, "Catches Lua errors for BugSack"],
    "bugsack": [HOOD, "Collects Lua errors so they don't interrupt you"],
    "ace3": [HOOD, "Library that many addons are built on"]
  };
  var DB_KEYS = Object.keys(DB).sort(function (a, b) { return b.length - a.length; });
  function known(folder) {
    var f = folder.toLowerCase();
    if (DB[f]) return DB[f];
    for (var i = 0; i < DB_KEYS.length; i++) {
      var k = DB_KEYS[i];
      if (k.length >= 4 && f.indexOf(k) === 0) return DB[k];
    }
    return null;
  }
  // Authors' own .toc categories, folded into the broad groups
  function bucket(text) {
    var s = (text || "").toLowerCase();
    if (!s) return null;
    if (/librar|develop|framework/.test(s)) return HOOD;
    if (/quest|map|level|guide|navigat|explor/.test(s)) return QM;
    if (/unit ?frame|action ?bar|nameplate|interface|\bui\b|chat|bag|inventory|tooltip|minimap|skin|hud/.test(s)) return UI;
    if (/combat|raid|dungeon|boss|pvp|arena|battleground|damage|heal|dps|tank|class|cooldown|aura|buff|threat|cast/.test(s)) return CB;
    if (/auction|econom|profession|trade|gold|craft|gather|loot|gear|item|vendor|mail/.test(s)) return GE;
    if (/quality|utilit|misc|social|convenien/.test(s)) return QL;
    return null;
  }
  function lowerMap(o) { var m = {}; Object.keys(o || {}).forEach(function (k) { m[k.toLowerCase()] = o[k]; }); return m; }
  var catOverride = lowerMap(D.categories), noteOverride = lowerMap(D.notes);

  function categoryOf(a) {
    var f = a.folder.toLowerCase();
    if (catOverride[f]) return catOverride[f];
    var k = known(a.folder);
    if (k) return k[0];
    if (/^(lib|!)/.test(f)) return HOOD;
    return bucket(a.category) || bucket(a.xCategory) || OTHER;
  }
  function descOf(a) {
    var f = a.folder.toLowerCase();
    if (noteOverride[f]) return noteOverride[f];
    var k = known(a.folder);
    if (k && k[1]) return k[1];
    if (a.notes && plain(a.notes).toLowerCase() !== plain(a.title || a.folder).toLowerCase()) return a.notes;
    if (/^lib/.test(f)) return "Shared library used by other addons";
    return "";
  }

  // ------------------------------------------------------------ WoW text codes
  function legible(hex) {
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 90;
  }
  function wow(str, el) {
    var color = null, buf = "", i = 0;
    function flush() {
      if (!buf) return;
      if (color) { var s = document.createElement("span"); s.style.color = color; s.textContent = buf; el.appendChild(s); }
      else el.appendChild(document.createTextNode(buf));
      buf = "";
    }
    while (i < str.length) {
      var c = str[i], n = str[i + 1];
      if (c === "|" && n) {
        if (n === "|") { buf += "|"; i += 2; continue; }
        if ((n === "c" || n === "C") && /^[0-9a-f]{8}$/i.test(str.substr(i + 2, 8))) {
          flush(); var hex = str.substr(i + 4, 6); color = legible(hex) ? "#" + hex : null; i += 10; continue;
        }
        if (n === "r" || n === "R") { flush(); color = null; i += 2; continue; }
        if (n === "n") { buf += " "; i += 2; continue; }
        if (n === "T" || n === "A") {
          var end = str.indexOf(n === "T" ? "|t" : "|a", i + 2);
          if (end >= 0) { i = end + 2; continue; }
        }
      }
      buf += c; i++;
    }
    flush();
    return el;
  }
  function plain(str) {
    return (str || "").replace(/\|\|/g, "\u0001").replace(/\|c[0-9a-f]{8}/gi, "").replace(/\|r/gi, "")
      .replace(/\|T.*?\|t/g, "").replace(/\|A.*?\|a/g, "").replace(/\|n/g, " ")
      .replace(/\u0001/g, "|").replace(/\s+/g, " ").trim();
  }

  // ------------------------------------------------------------ grouping
  var hidden = {};
  D.hide.forEach(function (h) { hidden[String(h).toLowerCase()] = true; });
  var addons = D.addons.filter(function (a) {
    return !hidden[a.folder.toLowerCase()] && (!D.onlyEnabled || a.enabled !== false);
  });

  function firstToken(s) { return s.toLowerCase().split(/[-_ .]/)[0]; }
  function index(list) { var m = {}; list.forEach(function (a) { m[a.folder.toLowerCase()] = a; }); return m; }
  function parentIn(map, a) {
    var self = a.folder.toLowerCase();
    var hints = [a.partOf, a.group].filter(Boolean);
    for (var i = 0; i < hints.length; i++) {
      var p = map[hints[i].toLowerCase()];
      if (p && p !== a) return p;
    }
    for (var j = 0; j < a.deps.length; j++) {
      var d = map[String(a.deps[j]).toLowerCase()];
      if (!d || d === a) continue;
      var pf = d.folder.toLowerCase();
      if (self.indexOf(pf) === 0 || firstToken(self) === firstToken(pf)) return d;
    }
    return null;
  }
  function rootIn(map, a) {
    var seen = [a], cur = a, p;
    while ((p = parentIn(map, cur)) && seen.indexOf(p) < 0) { seen.push(p); cur = p; }
    return cur;
  }

  var byKey = index(addons);
  var roots = [];
  addons.forEach(function (a) { a.children = []; });
  addons.forEach(function (a) {
    var r = rootIn(byKey, a);
    if (r === a) roots.push(a); else r.children.push(a);
  });

  // ------------------------------------------------------------ time
  var NOW = Date.now(), WEEK = 7 * 864e5;
  var rtf = window.Intl && Intl.RelativeTimeFormat ? new Intl.RelativeTimeFormat("en", { numeric: "auto" }) : null;
  function ago(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return "";
    var s = Math.round((t - NOW) / 1000), a = Math.abs(s);
    if (a < 60) return "just now";
    var steps = [[3600, 60, "minute"], [86400, 3600, "hour"], [604800, 86400, "day"], [2629800, 604800, "week"], [31557600, 2629800, "month"], [Infinity, 31557600, "year"]];
    for (var i = 0; i < steps.length; i++) {
      if (a < steps[i][0]) {
        var v = Math.round(s / steps[i][1]);
        if (rtf) return rtf.format(v, steps[i][2]);
        v = Math.abs(v); return v + " " + steps[i][2] + (v === 1 ? "" : "s") + " ago";
      }
    }
    return "";
  }

  // ------------------------------------------------------------ changes this week
  var latest = {};
  D.changes.forEach(function (e) {
    var t = Date.parse(e.at);
    if (!isNaN(t) && NOW - t < WEEK) latest[e.folder.toLowerCase()] = e;   // later entries win
  });
  var recent = Object.keys(latest).map(function (k) { return latest[k]; });
  var addedSet = {}, removed = [];
  recent.forEach(function (e) {
    var key = e.folder.toLowerCase();
    if (e.type === "added" && byKey[key]) addedSet[key] = e;
    if (e.type === "removed" && !byKey[key]) removed.push(e);
  });
  var removedMap = index(removed);
  var shownChanges = [];
  Object.keys(addedSet).forEach(function (k) {
    var a = byKey[k], r = rootIn(byKey, a);
    if (r !== a && addedSet[r.folder.toLowerCase()]) return;   // module of an addon that is itself new
    shownChanges.push({ e: addedSet[k], a: a, root: r });
  });
  removed.forEach(function (e) {
    if (rootIn(removedMap, e) !== e) return;
    shownChanges.push({ e: e });
  });
  shownChanges.sort(function (x, y) { return Date.parse(y.e.at) - Date.parse(x.e.at); });

  // ------------------------------------------------------------ icons (lucide)
  var ICONS = {
    "Interface": '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>',
    "Combat": '<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/>',
    "Questing & maps": '<path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/>',
    "Gear & economy": '<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
    "Quality of life": '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
    "Under the hood": '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    "_": '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
    "history": '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
    "out": '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    "chev": '<path d="m9 18 6-6-6-6"/>'
  };
  function icon(name, cls) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    s.setAttribute("class", "i" + (cls ? " " + cls : ""));
    s.innerHTML = ICONS[name] || ICONS._;
    return s;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function linkFor(a) {
    if (/^\d+$/.test(a.curseId || "")) return { href: "https://www.curseforge.com/projects/" + a.curseId, label: "CurseForge" };
    if (/^\d+$/.test(a.wowiId || "")) return { href: "https://www.wowinterface.com/downloads/info" + a.wowiId, label: "WoWInterface" };
    var w = (a.website || "").trim();
    if (w && !/\s/.test(w)) {
      if (!/^https?:\/\//i.test(w)) w = "https://" + w;
      return { href: w, label: "Website" };
    }
    return null;
  }
  var titleOf = function (a) { return a.title || a.folder; };
  var byTitle = function (x, y) { return plain(titleOf(x)).localeCompare(plain(titleOf(y))); };

  // ------------------------------------------------------------ header
  var who = D.pageTitle || (D.streamerName ? D.streamerName + "’s addons" : "Addons");
  $("title").textContent = who;
  document.title = who;

  var meta = $("meta");
  function metaItem(node) { var li = el("li"); li.appendChild(node); meta.appendChild(li); }
  metaItem(document.createTextNode(D.gameLabel || "WoW Forever"));
  var count = el("b", null, String(roots.length));
  var cnt = document.createDocumentFragment(); cnt.appendChild(count); cnt.appendChild(document.createTextNode(roots.length === 1 ? " addon" : " addons"));
  metaItem(cnt);
  if (D.lastChanged && ago(D.lastChanged)) metaItem(document.createTextNode("list changed " + ago(D.lastChanged)));
  if (D.twitchUrl && /^https?:\/\//i.test(D.twitchUrl)) {
    var tw = el("a", null, D.twitchUrl.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, ""));
    tw.href = D.twitchUrl;
    metaItem(tw);
  }

  // ------------------------------------------------------------ this week panel
  if (shownChanges.length) {
    var box = $("changes");
    var h = el("h2"); h.appendChild(icon("history")); h.appendChild(document.createTextNode("This week"));
    box.appendChild(h);
    var ol = el("ol");
    shownChanges.forEach(function (c) {
      var li = el("li");
      var added = c.e.type === "added";
      li.appendChild(el("span", "tag " + (added ? "added" : "removed"), added ? "Added" : "Removed"));
      if (added) {
        var a = el("a", "what"); a.href = "#a-" + slug(c.root.folder);
        wow(titleOf(c.a), a);
        if (c.root !== c.a) a.appendChild(el("span", "ver", " in " + plain(titleOf(c.root))));
        a.addEventListener("click", function () { flash("a-" + slug(c.root.folder)); });
        li.appendChild(a);
      } else {
        li.appendChild(el("span", "what", plain(titleOf(c.e))));
      }
      li.appendChild(el("span", "when", ago(c.e.at)));
      ol.appendChild(li);
    });
    box.appendChild(ol);
    box.hidden = false;
  }
  function flash(id) {
    var card = $(id);
    if (!card) return;
    var hood = card.closest("details");
    if (hood) hood.open = true;
    card.classList.add("flash");
    setTimeout(function () { card.classList.remove("flash"); }, 1600);
  }

  // ------------------------------------------------------------ categories + cards
  var groups = {};
  roots.forEach(function (a) { var c = categoryOf(a); (groups[c] = groups[c] || []).push(a); });
  function rank(n) { var i = ORDER.indexOf(n); return i >= 0 ? i : n === HOOD ? 99 : n === OTHER ? 98 : 50; }
  var names = Object.keys(groups).sort(function (x, y) { return rank(x) - rank(y) || x.localeCompare(y); });

  var list = $("list"), cats = $("cats"), rows = [], sections = [];
  names.forEach(function (cat) {
    var items = groups[cat].sort(byTitle);
    var id = "c-" + slug(cat);
    var sec = el("section", "cat"); sec.id = id;

    var head = el("div", "cat-head");
    head.appendChild(el("h2", null, cat));
    head.appendChild(el("span", "n", String(items.length)));
    var grid = el("div", "grid");

    if (cat === HOOD) {
      var det = el("details", "hood");
      var sum = el("summary");
      head.insertBefore(icon("chev", "chev"), head.firstChild);
      sum.appendChild(head);
      det.appendChild(sum);
      det.appendChild(el("p", "hood-note", "Libraries and helpers other addons need"));
      det.appendChild(grid);
      sec.appendChild(det);
    } else {
      sec.appendChild(head);
      sec.appendChild(grid);
    }

    items.forEach(function (a) {
      var card = el("article", "addon"); card.id = "a-" + slug(a.folder);
      var top = el("div", "addon-head");
      top.appendChild(wow(titleOf(a), el("span", "name")));
      var v = (a.version || "").trim();
      if (/^v?\d[\w.\-]*$/i.test(v)) top.appendChild(el("span", "ver", /^\d/.test(v) ? "v" + v : v));
      if (addedSet[a.folder.toLowerCase()]) top.appendChild(el("span", "new", "New"));
      card.appendChild(top);

      var d = descOf(a);
      if (d) card.appendChild(wow(d, el("p", "desc")));
      if (a.children.length) {
        var kids = a.children.slice().sort(byTitle).map(function (c) { return plain(titleOf(c)); });
        card.appendChild(el("p", "mods", "Includes " + kids.join(", ")));
      }
      var link = linkFor(a);
      if (link) {
        var foot = el("div", "foot");
        var la = el("a", "link", link.label); la.href = link.href; la.target = "_blank"; la.rel = "noopener";
        la.appendChild(icon("out"));
        foot.appendChild(la);
        card.appendChild(foot);
      }
      grid.appendChild(card);
      rows.push({ card: card, sec: sec, text: [a.folder, plain(a.title), plain(d)].concat(
        a.children.map(function (c) { return c.folder + " " + plain(c.title); })).join(" ").toLowerCase() });
    });
    list.appendChild(sec);
    sections.push(sec);

    var li = el("li");
    var nav = el("a"); nav.href = "#" + id; nav.dataset.target = id;
    nav.appendChild(icon(ICONS[cat] ? cat : "_"));
    nav.appendChild(el("span", null, cat));
    nav.appendChild(el("span", "n", String(items.length)));
    if (cat === HOOD) nav.addEventListener("click", function () { sec.querySelector("details").open = true; });
    li.appendChild(nav); cats.appendChild(li);
  });

  $("side").hidden = roots.length === 0;
  if (!roots.length) { $("none").textContent = "No addons found"; $("none").hidden = false; }

  // ------------------------------------------------------------ search
  $("search").addEventListener("input", function (e) {
    var q = e.target.value.trim().toLowerCase(), shown = 0, live = new Set();
    rows.forEach(function (r) {
      var ok = !q || r.text.indexOf(q) >= 0;
      r.card.hidden = !ok;
      if (ok) { shown++; live.add(r.sec); }
    });
    sections.forEach(function (s) {
      s.hidden = !live.has(s);
      var det = s.querySelector("details");
      if (det && q && live.has(s)) det.open = true;
    });
    $("changes").hidden = !!q || !shownChanges.length;
    $("none").hidden = shown > 0 || !roots.length;
  });

  // ------------------------------------------------------------ highlight the category in view
  if ("IntersectionObserver" in window) {
    var links = cats.querySelectorAll("a");
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (l) { l.classList.toggle("on", l.dataset.target === en.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    sections.forEach(function (s) { io.observe(s); });
  }
})();
</script>
</body>
